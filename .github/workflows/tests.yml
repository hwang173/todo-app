name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore backend
    
    - name: Build
      run: dotnet build backend --no-restore
    
    - name: Run tests
      run: dotnet test backend/TodoApi.Tests/TodoApi.Tests.csproj --no-build --verbosity normal

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/todo-ui/package-lock.json'
    
    - name: Install dependencies
      run: npm ci
      working-directory: frontend/todo-ui
    
    - name: Run tests
      run: npm test
      working-directory: frontend/todo-ui
    
    - name: Generate coverage
      run: npm test -- --coverage
      working-directory: frontend/todo-ui
      continue-on-error: true
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./frontend/todo-ui/coverage/coverage-final.json
      continue-on-error: true
